<div class="ov" id="ti" style="display:flex"><h1>火鍋裡的老鼠</h1><p id="hp" style="display:none">WASD／方向鍵 移動（輸入法開啟也可操作）　滑鼠決定朝向　左鍵捕鼠　靠近便利商店按右鍵購物　P 暫停<br>在朝向前方 48 像素的扇形內才抓得到。別讓老鼠鑽進鼠洞，失控指數滿 100 就結束。<br>1 分鐘後內湖車潮開始，塞車會擋住你，卻擋不住老鼠。</p><button id="b1">開始遊戲</button><button id="bh">遊玩方式</button><p class="sm">本作為虛構政治諷刺遊戲，所有人物、公告與留言純屬創作。</p></div>

<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=$('w');
let sd=+new URLSearchParams(location.search).get('seed')||Date.now();
function rnd(){sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

traf:['交通流量仍在可管理範圍，請用路人耐心等候。','內湖路段目前為動態平衡中。','車流呈現穩定且具秩序的緩行狀態。'],
combo:['本市捕鼠效率顯著提升，成果有目共睹。','治理成果亮眼，團隊持續精進。','數據顯示防治量能穩定成長。'],
high:['目前情勢尚在掌握，請市民保持冷靜。','必要時將採取進一步措施，細節尚待研議。','請市民勿恐慌，本府將滾動檢討。']};
const CM=['新聞說很順，導航怎麼還是紅的？','老鼠跑得比車快。','請問專案小組什麼時候到現場？','至少公告更新得很勤快。','所謂動態平衡，就是動不了但很平衡嗎？','滾動檢討，是不是還沒滾到這裡？'];
const K={};let S='TITLE',t,sc,mult,lastC,maxC,caught,totEsc,E,rats,veh,fx,P,spT,vT,holes,lastA,cool,annT,annHot,cmtT,hi,d,jam=[0,0,0,0],mx=480,my=300;
function reset(){M=0;UP={r:0,s:0,c:0};cPrice=300;spent=0;earned=0;hintT=0;lock=0;moneyFlash=0;applyUp();t=0;sc=0;mult=0;lastC=-99;maxC=0;caught=0;totEsc=0;E=0;rats=[];veh=[];fx=[];P={x:480,y:300,f:0,cd:0,sw:0,st:0,w:0};spT=0;vT=0;
 holes=C.holes.map(h=>({x:h[0],y:h[1],at:0}));hi=0;lastA=-99;cool={};annT=C.every;annHot=0;cmtT=8;d=.15;
 for(let i=0;i<3;i++)spawn();say('gen',1);$('cmt').textContent=''}
function spawn(){const h=pick(holes.filter(h=>h.at<=t));const bo=t>20&&rnd()<.1&&rats.filter(q=>q.boss).length<3,r=rnd(),a=t<60?[.5,.8,1]:t<120?[.35,.6,.85]:[.25,.45,.75];
 rats.push({x:h.x+R(-10,10),y:h.y+R(8,20),type:bo?pick(['flee','rand','esc']):r<a[0]?'flee':r<a[1]?'rand':r<a[2]?'esc':'chase',boss:bo,hp:2,hit:0,k:R(.85,1),age:0,conv:R(8,16)*Math.max(.5,1-t/400),wt:0,wa:0,dir:1})}
function say(cat,force){if(!force&&(t-lastA<C.gap||t-(cool[cat]??-99)<C.cool))return;lastA=t;cool[cat]=t;
 const a=$('ann');a.textContent='【市府（虛構）】'+pick(POOL[cat]);a.classList.add('hot');annHot=C.show}
const dens=()=>t<60?.15:Math.min(1,.15+(t-60)/120*.85);
function hitV(x,y){for(const v of veh)if(x+9>v.x&&x-9<v.x+v.w&&y+5>v.y-v.h/2&&y-5<v.y+v.h/2)return 1;return 0}
function update(dt){t+=dt;hintT=Math.max(0,hintT-dt);moneyFlash=Math.max(0,moneyFlash-dt);d=dens();
 let dx=(K.d?1:0)-(K.a?1:0),dy=(K.s?1:0)-(K.w?1:0);if(dx&&dy){dx*=.7071;dy*=.7071}
 const sp=C.spd*dt;const in0=hitV(P.x,P.y);let nx=Math.min(944,Math.max(16,P.x+dx*sp));if(in0||!hitV(nx,P.y))P.x=nx;
 let ny=Math.min(484,Math.max(160,P.y+dy*sp));if(in0||!hitV(P.x,ny))P.y=ny;P.w+=(dx||dy)?dt*10:0;
 if(hitV(P.x,P.y)){P.st+=dt;if(P.st>1)P.y+=(P.y<300?-1:1)*120*dt}else P.st=0;
 P.f=Math.atan2(my-P.y,mx-P.x);P.cd-=dt;P.sw-=dt;if(t-lastC>C.win)mult=0;
 // vehicles

 if(vT<=0&&veh.length<maxV){vT=1.1/(.25+d*1.6);const l=rnd()*4|0,dr=l<2?1:-1,ty=rnd(),ci=ty<.5?10+(rnd()*5|0):rnd()<.2?15+(rnd()*5|0):rnd()*10|0,w=CS[ci][0],h=CS[ci][1];
  if(!veh.some(o=>o.l==l&&(dr>0?o.x<w+40:o.x+o.w>920-w)))veh.push({l,dr,w,h,ty,ci,x:dr>0?-w:960,y:231+l*50,base:ci>=15?R(70,100):ty<.5?R(130,170):R(80,120),jf:R(.7,1),want:rnd()<.2?70:10,v:0,c:pick(['#d33','#38c','#eb3','#3a6','#eee','#c6c'])})}
 const ln=[[],[],[],[]];veh.forEach(v=>ln[v.l].push(v));
 for(const v of veh){let gap=999;for(const o of ln[v.l])if(o!==v&&(o.x-v.x)*v.dr>0)gap=Math.min(gap,Math.max(0,v.dr>0?o.x-v.x-v.w:v.x-o.x-o.w));
  if(S=='PLAYING'&&(P.x-v.x)*v.dr>0&&P.y+5>v.y-v.h/2&&P.y-5<v.y+v.h/2)gap=Math.min(gap,Math.max(0,v.dr>0?P.x-9-v.x-v.w:v.x-P.x-9));
  v.v=Math.min(v.base*(1-.85*d*v.jf),Math.max(0,(gap-v.want)*3));v.x+=v.dr*v.v*dt}
 veh=veh.filter(v=>v.x>-180&&v.x<1120);
 for(let l=0;l<4;l++)jam[l]=ln[l].length>2&&ln[l].reduce((s,v)=>s+v.v/v.base,0)/ln[l].length<.3;
 // holes
 if(hi<3&&t>=C.extra[hi][0]){holes.push({x:C.extra[hi][1][0],y:C.extra[hi][1][1],at:t+1.5});hi++}
 // rats
 spT-=dt;if(spT<=0){spT=Math.max(.7,2.2-t*.01);if(rats.length<C.maxR)spawn()}
 const act=holes.filter(h=>h.at<=t);
 for(let i=rats.length-1;i>=0;i--){const r=rats[i];r.age+=dt;if(r.type!='esc'&&r.age>r.conv)r.type='esc';
  if(r.hit>0)r.hit-=dt;let s=180*(.5+.4*Math.min(1,t/240))*r.k;if(r.boss)s*=1.3;if(r.hit>0)s*=.3;if(r.type=='chase')s=Math.min(s,144);if(r.y>206&&r.y<404&&jam[Math.min(3,(r.y-206)/50|0)])s*=1.15;
  const ddx=P.x-r.x,ddy=P.y-r.y,dd=Math.hypot(ddx,ddy);let a;
  if(r.type=='chase')a=Math.atan2(ddy,ddx);else if(r.type=='flee'&&dd<140)a=Math.atan2(-ddy,-ddx);
  else if(r.type=='esc'){let b=null,bd=1e9;for(const h of act){const q=Math.hypot(h.x-r.x,h.y-r.y);if(q<bd){bd=q;b=h}}a=Math.atan2(b.y-r.y,b.x-r.x);
   if(bd<16){rats.splice(i,1);E+=r.boss?2:1;totEsc++;say('esc');continue}}
  else{r.wt-=dt;if(r.wt<=0){r.wa=R(0,6.28);r.wt=R(1,3)}a=r.wa}
  r.x+=Math.cos(a)*s*dt;r.y+=Math.sin(a)*s*dt;r.dir=Math.cos(a)<0?-1:1;
  if(r.x<16||r.x>944||r.y<158||r.y>480){r.x=Math.min(944,Math.max(16,r.x));r.y=Math.min(480,Math.max(158,r.y));r.wt=0}}
 E=Math.max(0,E-C.dec*dt);fx=fx.filter(f=>(f.t-=dt)>0);
 // announcements
 const N=rats.length,cc=Math.min(100,C.rw*N+C.ew*E);

 if((annHot-=dt)<=0)$('ann').classList.remove('hot');
 if((cmtT-=dt)<=0){cmtT=R(16,24);$('cmt').textContent='市民留言：'+pick(CM)}
 if(cc>=100)over()}
const chaos=()=>Math.min(100,C.rw*rats.length+C.ew*E);
function click(){if(S!='PLAYING'||P.cd>0||performance.now()<lock)return;P.sw=.25;let b=null,bd=1e9;
 for(const r of rats){const q=Math.hypot(r.x-P.x,r.y-P.y);if(q>C.rng)continue;let a=Math.atan2(r.y-P.y,r.x-P.x)-P.f;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)<=C.half&&q<bd){bd=q;b=r}}
 if(!b){P.cd=C.cdM;return}P.cd=C.cdH;if(b.boss&&--b.hp>0){b.hit=.3;fx.push({x:b.x,y:b.y,t:.6,s:'HIT'});return}rats.splice(rats.indexOf(b),1);caught++;
 mult=(t-lastC<=C.win&&mult>0)?Math.min(C.maxM,mult+1):1;lastC=t;maxC=Math.max(maxC,mult);E=Math.max(0,E-(b.boss?1:.5));const pt=C.base*(b.boss?2:1)*mult;sc+=pt;const gd=b.boss?200:50;M+=gd;earned+=gd;moneyFlash=.4;fx.push({x:b.x,y:b.y,t:.6,s:'+'+pt+'  +'+gd+'G'})}
function over(){S='OVER';const ca=caught,es=totEsc,c=Math.round(chaos()),tr=d<.3?'順暢':d<.7?'壅塞':'嚴重塞車',tm=fmt(t);let m;
 if(t<90)m=pick(['本府即時掌握狀況，將立即啟動後續研議。','情勢變化迅速，已於第一時間成立專案小組。']);
 else if(t>=150&&d>=.7)m=pick(['車流維持動態平衡，市民展現高度耐心，本府深表感謝。','交通韌性獲得實證，整體路況可控。']);
 else if(ca>=40&&es*4<=ca)m=pick(['本局成果亮眼，防治量能持續精進，後續將再接再厲。','數據證明方向正確，惟仍有精進空間，將持續檢討。']);
 else if(es>ca/2)m=pick(['問題成因複雜，涉及多重因素，將持續滾動檢討。','部分鼠群選擇自主遷徙，本府尊重並持續追蹤。']);
 else m='整體表現符合預期，將持續檢討、持續精進。';
 const o=$('ov');o.style.display='flex';o.innerHTML=`<h1>結算報告</h1><div class="cols"><div><b>官方版</b><br>防治成果指數：${Math.min(100,70+(ca>>1))}<br>自主遷徙：${es} 隻<br>管理中指數：${c}<br>交通狀態：動態平衡<br>穩定運作時間：${tm}<br>民間消費活絡指數：${Math.min(100,70+(spent/50|0))}</div><div><b>實際版</b><br>最終分數：${sc}<br>捕捉：${ca} 隻　逃逸：${es} 隻<br>最高連擊：×${maxC}<br>最終失控指數：${c}<br>車潮：${tr}　存活：${tm}<br>賺得資金：${earned} G　花費：${spent} G</div></div><p>【市府（虛構）評語】${m}</p><div><button id="b3">重新開始</button><button id="b4">返回開始畫面</button></div><p class="sm">本作為虛構政治諷刺遊戲，所有內容純屬創作。</p>`;
 $('b3').onclick=start;$('b4').onclick=()=>{o.style.display='none';$('ti').style.display='flex';S='TITLE'}}

$('b1').onclick=start;$('b2').onclick=pause;$('bh').onclick=()=>{const p=$('hp');p.style.display=p.style.display=='none'?'block':'none'};addEventListener('blur',()=>{for(const q in K)K[q]=0;if(S=='PLAYING')pause()});
